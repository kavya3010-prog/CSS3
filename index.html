<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Example</title>

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }

        h2 {
            color: blue;
            text-align: center;
            text-shadow: 2px 2px 4px gray; /* CSS3 property */
        }

        p {
            color: green;
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color:red; text-align:center; border-radius:10px;">
        Welcome to CSS3
    </h1>

    <!-- Internal CSS -->
    <h2>Internal CSS Example</h2>

    <p>
        This paragraph is styled using internal CSS.
    </p>

    <!-- External CSS -->
    <div class="box">
        This box is styled using external CSS.
    </div>

</body>
</html>
